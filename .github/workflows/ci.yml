name: CI

# No repo-relative paths are hardcoded (no path filters, no working-directory, no
# cache-dependency-path) so this file keeps working unmodified once this package is git-init-ed
# into its own standalone repository, where it becomes the repository root - the self-contained
# target state, not wherever it is authored from today.

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run typecheck:contract
      - run: npm test
      - run: npm run build
      - run: npm run verify
      - run: npm run docs:check
      - run: npm run sync:name -- --check
